name: Release

# Publishes every package whose version is not on npm yet, through npm trusted
# publishing (OIDC), so no npm token is stored anywhere. Bumping a version on
# main is the release; already-published versions are skipped.
on:
  push:
    branches: [main]
    paths: ['packages/*/package.json']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No registry-url: it writes an _authToken line that would be tried instead of OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm release
